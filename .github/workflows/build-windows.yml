name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name YG98CrossRipple --icon assets/YG98CrossRipple.ico --add-data "assets/YG98CrossRipple.ico;assets" --hidden-import=hid src/yg98_cross_ripple.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YG98CrossRipple-Windows
          path: dist/YG98CrossRipple.exe
